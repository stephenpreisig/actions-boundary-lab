
name: H018 Untrusted Producer

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  producer:
    runs-on: ubuntu-latest
    steps:
      - name: Record execution context
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "H018 producer baseline"
          echo "Event: $EVENT_NAME"
          echo "Repository: $REPOSITORY"
          echo "Run ID: $RUN_ID"
          echo "Declared permission: contents=read"
          
      - name: Test read-only token enforcement
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          STATUS=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/git/refs" \
            -d '{"ref":"refs/heads/h018-permission-probe","sha":"0000000000000000000000000000000000000000"}')

          echo "HTTP status: $STATUS"

          if [ "$STATUS" = "403" ]; then
            echo "PASS: Write operation forbidden"
          else
            echo "Review unexpected response:"
            cat response.json
            exit 1
          fi